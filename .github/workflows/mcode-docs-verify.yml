name: mcode-docs verify

# Re-runs the Plugin's own claim harness: every factual statement in the
# manual is asserted against the real CLI output and the real shipped
# source, on every push that touches the Plugin.
#
# Why this is separate from `ci.yml`: that job proves the documents are
# *well-formed* (manifest valid, presentation discipline held). This one
# proves they are *true right now* — which needs `mcode` installed, and
# is therefore too slow and too environment-dependent for the main suite.
#
# Evidence (verify/evidence/report.json) is uploaded as an artifact and
# never committed. The exit code is the gate: non-zero blocks the merge.
# `uncovered > 0` warns but does not block — a claim nobody has written
# yet is a gap to fill, not a regression.

on:
  push:
    paths:
      - 'plugins/weekbin/mcode-docs/**'
      - '.github/workflows/mcode-docs-verify.yml'
  pull_request:
    paths:
      - 'plugins/weekbin/mcode-docs/**'
      - '.github/workflows/mcode-docs-verify.yml'

permissions:
  contents: read

jobs:
  verify:
    name: verify claims (ubuntu-latest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b18 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      # Pinned to the baseline recorded in VERIFICATION.md. An unpinned
      # install would let a CLI release silently redefine what "verified"
      # means — the same class of bug this harness exists to catch.
      # --ignore-scripts=false / --include=optional matter: npm 12 blocks
      # install scripts by default and the native SQLite binding is
      # required at startup.
      - name: Install mcode at the documented baseline
        run: |
          set -euo pipefail
          npm install -g @minimax-ai/code@0.5.8 \
            --registry=https://registry.npmjs.org/ \
            --foreground-scripts \
            --ignore-scripts=false \
            --include=optional \
            --allow-scripts=@minimax-ai/code,better_sqlite3
          mcode --version

      - name: Run claim harness
        run: node plugins/weekbin/mcode-docs/verify/run.mjs

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mcode-docs-verify-evidence
          path: plugins/weekbin/mcode-docs/verify/evidence/report.json
          if-no-files-found: warn
          retention-days: 14
