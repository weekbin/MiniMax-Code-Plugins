<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MCode Trajectory Studio</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230d1014'/%3E%3Crect x='5' y='9' width='14' height='3' rx='1.5' fill='%23b98cff'/%3E%3Crect x='5' y='14.5' width='22' height='3' rx='1.5' fill='%2343c59e'/%3E%3Crect x='5' y='20' width='9' height='3' rx='1.5' fill='%23ffb454'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/style.css">
</head>
<body data-state="loading">

<aside id="sidebar">
  <header class="side-head">
    <h1>Trajectory<span>Studio</span></h1>
    <p id="source-line" class="muted">连接中…</p>
  </header>
  <div class="side-search">
    <input id="search" type="search" placeholder="搜索标题 / 工作区…" autocomplete="off" spellcheck="false">
  </div>
  <div class="side-filters" id="session-filters">
    <button class="chip is-on" data-agent="">全部</button>
    <button class="chip" data-agent="mavis">mavis</button>
    <button class="chip" data-agent="explore">explore</button>
    <button class="chip" data-agent="worker">worker</button>
    <button class="chip" data-agent="verifier">verifier</button>
  </div>
  <ul id="session-list" class="session-list"></ul>
</aside>

<main id="main">
  <header id="topbar">
    <div class="topbar-title">
      <h2 id="session-title">选择会话</h2>
      <p id="session-meta" class="muted"></p>
    </div>
    <div class="topbar-controls">
      <label class="toggle">
        <input type="checkbox" id="full-detail">
        <span>显示正文</span>
      </label>
      <button id="reload" class="btn">刷新</button>
    </div>
  </header>

  <section id="stats" class="stats"></section>

  <section id="overview-wrap" class="panel">
    <div class="panel-head">
      <h3>时间概览</h3>
      <div class="legend">
        <span class="lg lg-think"></span>思考段
        <span class="lg lg-out"></span>输出段
        <span class="lg lg-tool"></span>工具/等待
        <span class="lg lg-err"></span>失败
      </div>
    </div>
    <div id="overview" class="overview"></div>
    <p id="overview-hint" class="muted small"></p>
  </section>

  <section id="filters-wrapper" class="panel filters-panel">
    <div class="panel-head"><h3>筛选</h3><span id="filter-count" class="muted small"></span></div>
    <div class="filters" id="event-filters">
      <button class="chip is-on" data-filter="all">全部</button>
      <button class="chip" data-filter="assistant">助手</button>
      <button class="chip" data-filter="user">用户</button>
      <button class="chip" data-filter="tools">含工具调用</button>
      <button class="chip" data-filter="thinking">含思考</button>
      <button class="chip" data-filter="failed">失败</button>
      <button class="chip" data-filter="compaction">压缩</button>
      <input id="turn-jump" class="turn-jump" type="search" placeholder="跳转 turn ID" autocomplete="off" spellcheck="false">
    </div>
  </section>

  <section class="panel">
    <div class="panel-head">
      <h3>轨迹记录</h3>
      <span id="record-count" class="muted small"></span>
    </div>
    <div id="records" class="records"></div>
  </section>

  <section id="tasks-wrap" class="panel" hidden>
    <div class="panel-head"><h3>后台任务 / 子代理</h3><span id="task-count" class="muted small"></span></div>
    <div id="tasks" class="tasks"></div>
  </section>
</main>

<aside id="inspector" data-open="false">
  <header class="ins-head">
    <h3 id="ins-title">检查器</h3>
    <button id="ins-close" class="btn ghost" aria-label="关闭">×</button>
  </header>
  <div id="ins-body" class="ins-body">
    <p class="muted">点击任意记录查看详情。</p>
  </div>
</aside>

<div id="banner" class="banner" hidden></div>

<script src="/app.js" type="module"></script>
</body>
</html>
